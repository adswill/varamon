[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "varamon"
version = "0.1.0"
description = "Receive-only monitor for VARA HF signals"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
varamon = "varamon.__main__:main"

[tool.setuptools]
packages = ["varamon"]

[tool.setuptools.package-data]
varamon = ["page.html"]
