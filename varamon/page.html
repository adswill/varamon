<!doctype html><html lang="en"><head><meta charset="utf-8"><title>varamon</title>
<style>
:root{color-scheme:light dark;--rule:color-mix(in srgb,CanvasText 22%,Canvas);--faint:color-mix(in srgb,CanvasText 6%,Canvas)}
html,body{height:100%;margin:0}body{display:grid;grid-template-rows:auto minmax(120px,1fr) 150px auto;font:13px system-ui,sans-serif;background:Canvas;color:CanvasText}
#bar{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--rule);background:var(--faint)}#bar label{margin-left:8px}#bar .sep{width:1px;align-self:stretch;background:var(--rule);margin:0 4px}
#list{overflow:auto}table{border-collapse:collapse;width:100%;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
th{position:sticky;top:0;background:var(--faint);border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);text-align:left;font:12px system-ui,sans-serif;padding:2px 6px}
td{padding:1px 6px;white-space:nowrap;border-right:1px solid var(--faint)}tbody tr:nth-child(even){background:var(--faint)}tbody tr.sel{background:Highlight;color:HighlightText}tr.bad td{color:GrayText}tr.sel td{color:inherit}
#hex{overflow:auto;padding:4px 8px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;margin:0;border-top:1px solid var(--rule)}
#status{display:flex;gap:16px;padding:2px 8px;border-top:1px solid var(--rule);background:var(--faint);font-size:12px}#status span:first-child{flex:1}.err{color:#c00}
</style></head><body>
<div id="bar"><button id="open">Open…</button><input id="file" type="file" accept=".wav" hidden><span class="sep"></span><label for="device">Input</label><select id="device"><option value="">System default</option></select><button id="listen">Start</button><span class="sep"></span><button id="clear">Clear</button></div>
<div id="list"><table><thead><tr><th>No.</th><th>Time</th><th>Length</th><th>Type</th><th>Level</th><th>Bytes</th><th>CRC</th><th>Reply</th><th>Flags</th><th>Score</th></tr></thead><tbody id="rows"></tbody></table></div>
<pre id="hex"></pre><div id="status"><span id="msg">Ready. 2300 Hz mode, levels 1-16.</span><span id="lvl"></span><span id="count">0 frames</span></div>
<script>
const $=id=>document.getElementById(id);let log=[],ctx=null,stream=null,proc=null,pend=[],pn=0,chain=Promise.resolve(),wall=0;
function status(t,e){$('msg').textContent=t;$('msg').className=e?'err':''}
function hms(ms){return new Date(ms).toTimeString().slice(0,8)}
function add(f,time){log.push(f);const tr=$('rows').insertRow(),i=log.length-1;
 [i+1,time,f.dur.toFixed(2)+' s',f.kind.toUpperCase(),f.level,f.size,f.ok?'OK':'wrong',f.ok?f.reply:'',f.ok?[f.compressed?'compressed':'',f.last?'last':'',f.full?'full':''].filter(Boolean).join(' '):'',f.score.toFixed(2)].forEach(v=>tr.insertCell().textContent=v);
 if(!f.ok)tr.className='bad';tr.onclick=()=>{[...$('rows').rows].forEach(r=>r.classList.remove('sel'));tr.classList.add('sel');$('hex').textContent=f.ok?f.hex.match(/.{1,32}/g).map((l,n)=>String(n*16).padStart(4,'0')+'  '+l.match(/../g).join(' ')).join('\n'):'checksum failed'};
 $('count').textContent=log.length+' frames';$('list').scrollTop=$('list').scrollHeight}
async function openFile(f){status('Decoding '+f.name+'…');try{const j=await(await fetch('/file',{method:'POST',body:f})).json();if(j.error){status(j.error,true);return}j.frames.forEach(q=>add(q,q.t.toFixed(2)+' s'));status(f.name+' — '+j.seconds+' s, '+j.frames.filter(q=>q.ok).length+' of '+j.frames.length+' transmissions decoded')}catch(e){status(String(e),true)}}
async function devices(){const s=$('device'),k=s.value;const d=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind=='audioinput'&&x.deviceId&&x.deviceId!='default');s.length=1;d.forEach((x,i)=>s.add(new Option(x.label||'Input '+(i+1),x.deviceId)));s.value=[...s.options].some(o=>o.value==k)?k:''}
function flush(){const pcm=new Int16Array(pn);let o=0;for(const p of pend)for(let i=0;i<p.length;i++)pcm[o++]=Math.max(-32768,Math.min(32767,p[i]*32767));pend=[];pn=0;const w=wall;
 chain=chain.then(()=>fetch('/audio?rate='+ctx.sampleRate,{method:'POST',body:pcm.buffer})).then(r=>r.json()).then(j=>(j.frames||[]).forEach(q=>add(q,hms(w+q.t*1000)))).catch(()=>status('Decoder not reachable',true))}
async function start(){try{const id=$('device').value;stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:id?{exact:id}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){status('Cannot open audio input: '+e.message,true);return}
 await devices();await fetch('/reset',{method:'POST'});ctx=new AudioContext();const src=ctx.createMediaStreamSource(stream),mute=ctx.createGain();proc=ctx.createScriptProcessor(4096,1,1);mute.gain.value=0;src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);wall=Date.now();
 proc.onaudioprocess=e=>{const d=e.inputBuffer.getChannelData(0);pend.push(new Float32Array(d));pn+=d.length;let p=0;for(const v of d)p+=v*v;$('lvl').textContent='Level '+(p?(10*Math.log10(p/d.length)).toFixed(0):'-inf')+' dBFS';if(pn>=ctx.sampleRate)flush()};
 $('listen').textContent='Stop';status('Receiving from '+$('device').selectedOptions[0].textContent+' at '+ctx.sampleRate+' Hz')}
function stop(){if(proc)proc.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();ctx=stream=proc=null;$('listen').textContent='Start';$('lvl').textContent='';status('Stopped')}
$('open').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])openFile(e.target.files[0]);e.target.value=''};$('listen').onclick=()=>ctx?stop():start();$('clear').onclick=()=>{$('rows').innerHTML='';log=[];$('hex').textContent='';$('count').textContent='0 frames'};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])openFile(e.dataTransfer.files[0])});if(navigator.mediaDevices)devices();
</script></body></html>
