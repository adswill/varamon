[package]
name = "varamon"
description = "Receive-only monitor for VARA HF signals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
varamon-core = { path = "../varamon-core" }
cpal = { version = "0.15", optional = true }

[features]
default = ["sound"]
# audio input from a sound device; without it, live audio can still be piped in with --stdin
sound = ["dep:cpal"]
